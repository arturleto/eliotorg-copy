<text x="225" y="540" font-size="21" font-weight="700" fill="#2f4a35" text-anchor="middle">1. Расплавить: 45–50 °C</text>
<text x="225" y="568" font-size="18" fill="#6b7466" text-anchor="middle">все кристаллы разрушены</text>
<text x="545" y="540" font-size="21" font-weight="700" fill="#2f4a35" text-anchor="middle">2. Охладить: 27–28 °C</text>
<text x="545" y="568" font-size="18" fill="#6b7466" text-anchor="middle">растут кристаллы всех форм</text>
<text x="950" y="540" font-size="21" font-weight="700" fill="#2f4a35" text-anchor="middle">3. Подогреть: 31–32 °C</text>
<text x="950" y="568" font-size="18" fill="#6b7466" text-anchor="middle">остаются кристаллы формы V</text>
